<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IIIF VR Gallery → IIIF Kasane</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://kasane.ldas.jp/ja/gallery/" />
  <script>
    // IIIF VR Gallery は IIIF Kasane に統合した（2026-10）。?u= などの指定はそのまま引き継ぐ。
    // 言語は ?lang= を優先し、無ければブラウザの言語で決める（Kasane では URL の /ja/・/en/ で表す）。
    (function () {
      var q = new URLSearchParams(location.search);
      var lang = (q.get("lang") || navigator.language || "ja").slice(0, 2).toLowerCase() === "en" ? "en" : "ja";
      q.delete("lang");
      var qs = q.toString();
      location.replace("https://kasane.ldas.jp/" + lang + "/gallery/" + (qs ? "?" + qs : "") + location.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #15171c; color: #eaecef; font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
      line-height: 1.8; text-align: center; padding: 16px; }
    a { color: #d8bd78; }
  </style>
</head>
<body>
  <p>
    IIIF VR Gallery は IIIF Kasane に移りました。<br />
    IIIF VR Gallery has moved to IIIF Kasane.<br />
    <a href="https://kasane.ldas.jp/ja/gallery/">https://kasane.ldas.jp/ja/gallery/</a>
  </p>
</body>
</html>
